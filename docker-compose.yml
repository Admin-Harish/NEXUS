# Only NEXUS itself stays running. Targets under test (a cloned repository, or the
# built-in demo API) are built and started per run by the backend, then removed.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Generated pytest / Robot Framework suites, one timestamped folder per run.
      - ./generated_testsuites:/app/generated_testsuites
      # Lets the backend build and run target containers on this machine's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: nexus_net
